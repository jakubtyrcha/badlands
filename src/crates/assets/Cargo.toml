[package]
# Named "assets" — no dependency of this crate is itself named "assets", so
# (unlike src/crates/wesl's "wesl_ffi" workaround) there's no Corrosion
# `cargo rustc --package` ambiguity here.
name = "assets"
version = "0.1.0"
edition = "2024"

# The empty [workspace] table below makes this crate its own workspace root,
# so cargo doesn't walk up the directory tree looking for a parent workspace.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# `hdr` is Radiance .hdr, the equirect format HDRI environment maps ship in.
# `.exr` is deliberately NOT enabled: it is a separate format decision and
# nothing asks for it yet.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "hdr"] }
gltf = { version = "1.4", default-features = false }

# Default to panic=abort; Corrosion overrides this back to unwind at the
# CMake link step (RUSTFLAGS=-Cpanic=unwind) so the `catch_unwind` in the
# extern "C" thunks can actually catch panics instead of aborting the process.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
