[package]
# Named "nav" — no dependency of this crate is itself named "nav", so
# (unlike src/crates/wesl's "wesl_ffi" workaround) there's no Corrosion
# `cargo rustc --package` ambiguity here.
name = "nav"
version = "0.1.0"
edition = "2024"

# The empty [workspace] table below makes this crate its own workspace root,
# so cargo doesn't walk up the directory tree looking for a parent workspace.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cavalier_contours = "0.7.0"
parry2d = "0.29.0"
pathfinding = "4.15.0"
glam = { version = "0.33.2", features = ["bytemuck"] }

# Default to panic=abort; Corrosion overrides this back to unwind at the
# CMake link step (RUSTFLAGS=-Cpanic=unwind) so the `catch_unwind` in the
# extern "C" thunks can actually catch panics instead of aborting the process.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
