name: Shapeshifter
options:
  bundleIdPrefix: com.jakubtyrcha
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  ShapeshifterCore:
    type: library.static
    platform: macOS
    sources:
      - core/src
      - path: core/include
        buildPhase: none
      - path: shaders/shared_types.h
        buildPhase: none
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/vendor/metal-cpp"
          - "$(SRCROOT)/core/include"
          - "$(SRCROOT)/shaders"
      configs:
        # DCSDD reconstruction is expensive numerical code (dense per-cell
        # least-squares solves x hundreds of cells x outer iterations); at
        # the default Debug -O0 it runs ~43x slower than -O2 (measured with a
        # throwaway timing probe, single-cube remesh at the editor config:
        # 243.6s at -O0 vs 5.6s at -O2 on this machine), which makes the
        # app's Debug build effectively unusable for interactive editing.
        # Opt the core lib into -O2 even in Debug; the Swift app target is
        # untouched and stays fully debuggable. CoreTests links this lib
        # rather than compiling core/src itself, so its Debug config picks
        # up the same speedup for free (see CoreTests' own settings comment).
        Debug:
          GCC_OPTIMIZATION_LEVEL: "2"

  Shapeshifter:
    type: application
    platform: macOS
    sources:
      - app/Sources
      - path: shaders
        includes: ["*.metal"]
    dependencies:
      - target: ShapeshifterCore
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
    info:
      path: app/Info.plist
      properties:
        NSHighResolutionCapable: true
    settings:
      SWIFT_VERSION: "6.0"
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_OBJC_INTEROP_MODE: objcxx
      SWIFT_INCLUDE_PATHS: "$(SRCROOT)/core/include"
      OTHER_SWIFT_FLAGS: "-Xcc -std=gnu++20"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/core/include"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE

  CoreTests:
    type: tool
    platform: macOS
    sources: [tests/core]
    dependencies:
      - target: ShapeshifterCore
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
    settings:
      # No GCC_OPTIMIZATION_LEVEL override here: CoreTests' `sources` is only
      # tests/core -- it links ShapeshifterCore.a rather than compiling
      # core/src itself (see USER_HEADER_SEARCH_PATHS below, which exists
      # only to resolve local #include "camera.h"-style headers, not to add
      # core/src to this target's own source list). So it automatically
      # picks up ShapeshifterCore's Debug -O2 (see that target's settings
      # comment) through the dependency, with nothing to duplicate here.
      #
      # core/src is deliberately only a *quote* search path (USER_HEADER_SEARCH_PATHS,
      # -iquote): core/src/math.h shadows the C library's <math.h> if it's also on the
      # angle-bracket path, which breaks any TU that pulls in <cmath> (e.g. doctest.h).
      # Test files include local core/src headers with quotes ("camera.h", not <camera.h>).
      USER_HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/core/src"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/core/include"
        - "$(SRCROOT)/shaders"
        - "$(SRCROOT)/tests/vendor"
        - "$(SRCROOT)/vendor/metal-cpp"

schemes:
  Shapeshifter:
    build:
      targets:
        Shapeshifter: all
    run:
      config: Debug
  CoreTests:
    build:
      targets:
        CoreTests: all
    run:
      config: Debug
