name: Shapeshifter
options:
  bundleIdPrefix: com.jakubtyrcha
  # Follows the engine, not the other way round: the editor now links
  # badlands_rhi, the render graph and badlands_slang, which are built at the
  # SDK default. Promising an older minimum than the libraries linked into the
  # binary is a promise that cannot be kept.
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  # The C++ core and its test suite are NOT built here any more. They are CMake
  # targets in the repo root's CMakeLists.txt (`shapeshifter_core`,
  # `shapeshifter_core_tests`), so the editor core and the engine it will be
  # ported onto are described by one build system rather than two that can
  # disagree. The DCSDD Debug -O2 opt-in and the -iquote treatment of core/src
  # moved there with them, comments and all.
  #
  # What stays in Xcode is the part CMake is genuinely bad at: a SwiftUI .app
  # bundle with Swift/C++ interop. This target compiles the Swift shell and the
  # Metal shaders, and links the static library CMake produced.
  Shapeshifter:
    type: application
    platform: macOS
    sources:
      - app/Sources
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
    # Build the CMake half first. Dependency analysis is off because the inputs
    # live outside this project (all of core/src, plus the CMakeLists that
    # describes them); with it on, Xcode would skip the phase and the stale
    # archive would surface as a link error that reads like a code error.
    preBuildScripts:
      - name: Build shapeshifter_core (CMake)
        script: |
          "$SRCROOT/../../scripts/build.sh" shapeshifter_core
        basedOnDependencyAnalysis: false
    info:
      path: app/Info.plist
      properties:
        NSHighResolutionCapable: true
    settings:
      SWIFT_VERSION: "6.0"
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_OBJC_INTEROP_MODE: objcxx
      SWIFT_INCLUDE_PATHS: "$(SRCROOT)/core/include"
      OTHER_SWIFT_FLAGS: "-Xcc -std=gnu++20"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/core/include"
      # Search paths rather than XcodeGen `framework:` dependencies: these are
      # build products, so they do not exist when the project is generated on a
      # fresh clone. A search-path link tolerates that; a file reference makes
      # generation depend on build order.
      LIBRARY_SEARCH_PATHS:
        - "$(SRCROOT)/../../build"
        - "$(SRCROOT)/../../third_party/toolchains/slang/lib"
      # EVERY transitive dependency, spelled out. CMake resolves these for its
      # own consumers from target_link_libraries(shapeshifter_core PUBLIC ...),
      # but Xcode links the archive directly and knows nothing about that graph
      # -- so a library added on the CMake side must be added here too, or the
      # app fails at link with undefined symbols and nothing points at why.
      OTHER_LDFLAGS: "-lshapeshifter_core -lbadlands_render_graph -lbadlands_slang -lbadlands_rhi -lslang"
      # libslang is a dylib loaded at run time, and the SDK lives outside the
      # app bundle -- so the binary needs to be told where to find it.
      LD_RUNPATH_SEARCH_PATHS:
        - "$(SRCROOT)/../../third_party/toolchains/slang/lib"

schemes:
  Shapeshifter:
    build:
      targets:
        Shapeshifter: all
    run:
      config: Debug
